<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Login</title>
</head>
<body>
    <div class="w-screen h-screen bg-yellow-200 flex justify-center items-center">
        <div class="bg-white w-[500px] h-[400px] rounded-2xl p-5 flex items-center flex-col gap-2">
            <h2 class="text-5xl text-center text-emerald-600 font-bold">Welcome back!</h2>
            <p class="text-center text-blue-500 pb-5">please login to account</p>
            <form action="" class="flex flex-col">
                <input type="text" placeholder="Enter Your Name" class="border-[2px] p-3 mt-4 w-[300px] text-center ">
                <input type="password" placeholder="Password" class="border-[2px] p-3 mt-4 w-[300px] text-center ">
                <button class="bg-green-600 p-2 text-white rounded-[10px] w-[100px] h-[30px] ml-[100px] mt-[60px] flex items-center justify-center hover:bg-red-400">Submit</button>
            </form>
        </div>
    </div>
</body>
</html>
