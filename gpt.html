<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <title>Login</title>
</head>
<body>
    <div class="w-screen h-screen bg-[#000000] flex justify-center items-center">
        <div class="bg-[#212121] w-[400px] h-[660px] rounded-2xl p-5 flex items-center flex-col gap-2">
            <div class="w-[40px] h-[40px] rounded-[60px] flex justify-center items-center ml-[335px] bg-none hover:bg-[#676767]"><i class="fa-solid fa-xmark text-white text-[18px]"></i></div>   
            <h3 class="text-[30px] text-center text-[#FFFFFF] ">Log in or sign up</h3>
            <div class="flex flex-col"><p class="text-center text-[#FFFFFF] ">You’ll get smarter responses and can</p><p class="text-center text-white">upload files, images, and more.</p></div>
            <div>
                <button class="w-[350px] h-[50px]  rounded-[30px] mt-[40px] flex gap-[10px] items-center justify-center  border-[1px] border-[#434343] text-white  hover:bg-[#424242]"><img class="w-[20px] h-[20px]" src="google-logo-removebg-preview.png" alt="">Continue with Google</button>
                <button class="w-[350px] h-[50px] rounded-[30px] mt-[20px] flex gap-[10px] items-center justify-center border-[1px] border-[#434343] text-white hover:bg-[#424242]"><i class="fa-brands fa-apple text-white"></i>Continue with Apple</button>
                <button class="w-[350px] h-[50px] rounded-[30px] mt-[20px] flex gap-[10px] items-center justify-center  border-[1px] border-[#434343] text-white hover:bg-[#424242]"><i class="fa-solid fa-phone text-white"></i>Continue with Phone</button>
                <div class="flex justify-center items-center gap-[20px] mt-[30px]">
                    <div class="w-[140px] h-[1px] bg-[#676767]"></div>
                    <p class="text-[#676767]">OR</p>
                    <div class="w-[140px] h-[1px] bg-[#676767]"></div>
                </div>
                <form action="#">
                    <input class="w-[350px] h-[50px]  rounded-[30px] mt-[30px] p-[16px] text-[14px] bg-[#000000] placeholder-[#9E9E9E] border-[1px] border-[#434343] outline-[1px]  focus:border-[#cacaca] outline-none" type="text" placeholder="Email address">
                    <button class="w-[350px] h-[50px] rounded-[30px] mt-[20px] flex gap-[10px] items-center justify-center  border-[1px] border-[#434343] text-black bg-white hover:bg-[#ececec]">Continue</button>
                </form>
        </div>
    </div>
</body>
</html>
